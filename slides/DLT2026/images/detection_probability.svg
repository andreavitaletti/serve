<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310">
  <text x="350" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2c3e50">Detection Probability vs. Number of Queries</text>
  <text x="350" y="48" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">(Escape probability decreases exponentially with N)</text>

  <!-- Axes -->
  <line x1="80" y1="260" x2="660" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="260" x2="80" y2="70" stroke="#333" stroke-width="2"/>
  <!-- X label -->
  <text x="370" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Number of query pairs N</text>
  <!-- Y label -->
  <text x="30" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#555" transform="rotate(-90,30,170)">− log₂(escape prob.)</text>

  <!-- X ticks -->
  <text x="80" y="276" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">0</text>
  <text x="196" y="276" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">1000</text>
  <text x="312" y="276" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">2000</text>
  <text x="428" y="276" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">3000</text>
  <text x="544" y="276" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">4000</text>
  <text x="660" y="276" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">5000</text>

  <!-- Y ticks -->
  <text x="68" y="260" text-anchor="end" font-family="Arial" font-size="11" fill="#555">0</text>
  <text x="68" y="218" text-anchor="end" font-family="Arial" font-size="11" fill="#555">32</text>
  <text x="68" y="176" text-anchor="end" font-family="Arial" font-size="11" fill="#555">64</text>
  <text x="68" y="134" text-anchor="end" font-family="Arial" font-size="11" fill="#555">96</text>
  <text x="68" y="92" text-anchor="end" font-family="Arial" font-size="11" fill="#555">128</text>

  <!-- Grid lines -->
  <line x1="80" y1="218" x2="660" y2="218" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="176" x2="660" y2="176" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="134" x2="660" y2="134" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="92" x2="660" y2="92" stroke="#eee" stroke-width="1"/>

  <!-- 128-bit security line -->
  <line x1="80" y1="92" x2="660" y2="92" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="665" y="95" font-family="Arial" font-size="10" fill="#e74c3c">128-bit</text>

  <!-- Curve ε'=0.1 (blue) — linear approx: at N=5000 → 128 bits: y = 80 + (N/5000)*168 -->
  <polyline points="80,260 196,284 312,284" fill="none" stroke="#3498db" stroke-width="0" opacity="0"/>
  <!-- Approx curve: -log2 ≈ N * ε'^2 / (2μ + ε') * 1/ln2 ≈ N*0.01/1.7*1.44 ≈ N*0.00847 -->
  <!-- scale: 80=N0, 660=N5000 → xscale = 116px/1000N; yscale: 260=0, 92=128 → yscale=1.31px/bit -->
  <!-- N=0→(80,260), N=1000→bit=8.47→y=260-11=249, N=2000→17→237, N=3000→25→227, N=4000→34→215, N=5000→42→205 
       actually target: N=5000→128 bits so scale=128/5000=0.0256 bits per N
       N=1000→25.6→260-25.6*1.3125=260-33.6=226, N=2000→51.2→193, N=3000→76.8→159, N=4000→102.4→126, N=5000→128→92 -->
  <polyline points="80,260 196,226 312,193 428,159 544,126 660,92" 
            fill="none" stroke="#3498db" stroke-width="3"/>
  <text x="345" y="185" font-family="Arial" font-size="11" fill="#3498db">ε' = 0.1</text>

  <!-- Curve ε'=0.3 steeper: bits per N = 128/2000*N 
       N=0→(80,260), N=500→bits=32→y=260-42=218, N=1000→64→176, N=1500→96→134, N=2000→128→92 -->
  <polyline points="80,260 138,218 196,176 254,134 312,92 370,70 430,70" 
            fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="340" y="100" font-family="Arial" font-size="11" fill="#27ae60">ε' = 0.3</text>

  <!-- Annotations -->
  <circle cx="544" cy="126" r="5" fill="#3498db"/>
  <text x="548" y="118" font-family="Arial" font-size="10" fill="#3498db">N=4000</text>
  <circle cx="312" cy="92" r="5" fill="#27ae60"/>
  <text x="316" y="84" font-family="Arial" font-size="10" fill="#27ae60">N=2000</text>
  <circle cx="660" cy="92" r="5" fill="#3498db"/>
</svg>