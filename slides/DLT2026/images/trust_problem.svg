<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
  <!-- Client box -->
  <rect x="30" y="80" width="160" height="140" rx="12" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="110" y="108" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">Client</text>
  <text x="110" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Has benchmark B</text>
  <text x="110" y="148" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Wants quality τ</text>
  <text x="110" y="166" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Fears: paying for</text>
  <text x="110" y="182" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">degraded service</text>

  <!-- Server box -->
  <rect x="510" y="80" width="160" height="140" rx="12" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
  <text x="590" y="108" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">Server</text>
  <text x="590" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Has model M</text>
  <text x="590" y="148" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Wants payment</text>
  <text x="590" y="166" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Fears: free-riding</text>
  <text x="590" y="182" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">during trial</text>

  <!-- Arrows -->
  <line x1="200" y1="130" x2="500" y2="130" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8,4"/>
  <text x="350" y="122" text-anchor="middle" font-family="Arial" font-size="11" fill="#e74c3c">Server degrades after payment?</text>

  <line x1="500" y1="170" x2="200" y2="170" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="8,4"/>
  <text x="350" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#e74c3c">Client extracts answers without paying?</text>

  <!-- Title -->
  <text x="350" y="40" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">Two-Sided Trust Problem</text>
  <text x="350" y="62" text-anchor="middle" font-family="Arial" font-size="13" fill="#666">in AI Inference Services</text>
</svg>