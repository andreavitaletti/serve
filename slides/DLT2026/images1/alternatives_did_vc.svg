<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">Alternative: W3C DIDs &amp; Verifiable Credentials</text>
  <text x="350" y="48" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">Decentralized PKI Anchoring instead of Direct Supply Chain Ledger Storage</text>

  <!-- Issuer -->
  <rect x="30" y="80" width="150" height="90" rx="8" fill="#e8f8f5" stroke="#2ec4b6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="105" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0f5132">Manufacturer (Issuer)</text>
  <text x="105" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Signs passport data</text>
  <text x="105" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">with private key</text>

  <!-- Holder (Product) -->
  <rect x="275" y="80" width="150" height="90" rx="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="105" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1b4965">Product / Holder</text>
  <text x="350" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Stores VC off-chain</text>
  <text x="350" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">in local database</text>

  <!-- Verifier (Recycler) -->
  <rect x="520" y="80" width="150" height="90" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="595" y="105" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#7d6608">Recycler (Verifier)</text>
  <text x="595" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Validates signature</text>
  <text x="595" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">peer-to-peer</text>

  <!-- Flow Arrows -->
  <line x1="180" y1="110" x2="265" y2="110" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="222" y="100" text-anchor="middle" font-family="Arial" font-size="9" fill="#2c3e50">Issues VC</text>

  <line x1="425" y1="110" x2="510" y2="110" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="467" y="100" text-anchor="middle" font-family="Arial" font-size="9" fill="#2c3e50">Presents VP</text>

  <!-- Blockchain PKI at bottom -->
  <rect x="180" y="210" width="340" height="65" rx="8" fill="#1b3a4b" stroke="#003554" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="230" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">Decentralized PKI / Blockchain Registry</text>
  <text x="350" y="245" text-anchor="middle" font-family="Arial" font-size="9" fill="#e8ecf1">Stores ONLY: Public Keys &amp; DID Documents (Extremely light write ops)</text>
  <text x="350" y="258" text-anchor="middle" font-family="Arial" font-size="9" fill="#2ec4b6">No transaction fees for consumer queries · 100% private data</text>

  <!-- Resolving lines -->
  <path d="M 105 170 L 105 235 L 180 235" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <text x="140" y="225" font-family="Arial" font-size="8" fill="#7f8c8d">Publish Key</text>
  
  <path d="M 595 170 L 595 235 L 520 235" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <text x="560" y="225" font-family="Arial" font-size="8" fill="#7f8c8d">Resolve Key</text>
</svg>
