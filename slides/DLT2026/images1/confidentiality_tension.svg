<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="350" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">The DPP Information Paradox</text>
  <text x="350" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">Auditable Transparency vs. Commercial Secrecy</text>

  <!-- Transparency Box -->
  <rect x="40" y="80" width="240" height="180" rx="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2980b9">Public Transparency</text>
  <line x1="60" y1="115" x2="260" y2="115" stroke="#2980b9" stroke-width="1"/>
  
  <text x="60" y="140" font-family="Arial" font-size="11" fill="#34495e">• Recycled Content Verification</text>
  <text x="60" y="160" font-family="Arial" font-size="11" fill="#34495e">• Carbon footprint reporting (ESG)</text>
  <text x="60" y="180" font-family="Arial" font-size="11" fill="#34495e">• Repair instructions for recyclers</text>
  <text x="60" y="200" font-family="Arial" font-size="11" fill="#34495e">• Supply chain due diligence</text>
  <text x="60" y="225" font-family="Arial" font-size="11" font-weight="bold" fill="#2c3e50">Target: Regulators &amp; Consumers</text>

  <!-- Tension / VS Circle -->
  <circle cx="350" cy="170" r="30" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="350" y="176" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">VS</text>

  <!-- Confidentiality Box -->
  <rect x="420" y="80" width="240" height="180" rx="8" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#c0392b">Corporate Secrecy</text>
  <line x1="440" y1="115" x2="640" y2="115" stroke="#e74c3c" stroke-width="1"/>
  
  <text x="440" y="140" font-family="Arial" font-size="11" fill="#78281f">• Bill of Materials (Exact Recipe)</text>
  <text x="440" y="160" font-family="Arial" font-size="11" fill="#78281f">• Component unit pricing</text>
  <text x="440" y="180" font-family="Arial" font-size="11" fill="#78281f">• Supplier and subcontractor identities</text>
  <text x="440" y="200" font-family="Arial" font-size="11" fill="#78281f">• Production capacity &amp; volumes</text>
  <text x="440" y="225" font-family="Arial" font-size="11" font-weight="bold" fill="#2c3e50">Target: Competitors &amp; Arbitrageurs</text>
</svg>
