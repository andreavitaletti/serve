<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Lifecycle flow -->
  <!-- Raw -->
  <rect x="20" y="30" width="100" height="60" rx="8" fill="#e8ecf1" stroke="#bdc3c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="55" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Raw Materials</text>
  <text x="70" y="73" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">Mining/Origin</text>
  
  <line x1="120" y1="60" x2="150" y2="60" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Manufacturing -->
  <rect x="160" y="30" width="100" height="60" rx="8" fill="#e8ecf1" stroke="#bdc3c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="55" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Production</text>
  <text x="210" y="73" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">Carbon Data</text>
  
  <line x1="260" y1="60" x2="290" y2="60" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Consumer -->
  <rect x="300" y="30" width="100" height="60" rx="8" fill="#e8ecf1" stroke="#bdc3c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="55" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Usage &amp; Repair</text>
  <text x="350" y="73" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">Maintenance</text>
  
  <line x1="400" y1="60" x2="430" y2="60" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Recycle -->
  <rect x="440" y="30" width="100" height="60" rx="8" fill="#e8f8f5" stroke="#2ec4b6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="55" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0f5132">Recycling</text>
  <text x="490" y="73" text-anchor="middle" font-family="Arial" font-size="10" fill="#198754">Second Life</text>
  
  <!-- Digital Twin (DPP) anchor -->
  <rect x="130" y="140" width="300" height="130" rx="12" fill="#1b3a4b" stroke="#003554" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="170" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">Digital Product Passport (DPP)</text>
  <line x1="150" y1="180" x2="410" y2="180" stroke="#2ec4b6" stroke-width="1.5"/>
  
  <text x="160" y="205" font-family="Arial" font-size="11" fill="#e8ecf1">• Material Composition &amp; Recycled Content</text>
  <text x="160" y="223" font-family="Arial" font-size="11" fill="#e8ecf1">• Supply Chain Due Diligence &amp; ESG Data</text>
  <text x="160" y="241" font-family="Arial" font-size="11" fill="#e8ecf1">• Repair Manuals &amp; Disassembly Guidelines</text>

  <!-- Connectors from physical stages to DPP -->
  <path d="M 70 90 L 70 205 L 130 205" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  <path d="M 210 90 L 210 140" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  <path d="M 350 90 L 350 140" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  <path d="M 490 90 L 490 205 L 430 205" stroke="#2ec4b6" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
</svg>
