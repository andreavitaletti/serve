<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Authentic Item -->
  <rect x="30" y="50" width="160" height="100" rx="8" fill="#e8f8f5" stroke="#2ec4b6" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0f5132">Genuine Battery A</text>
  <rect x="60" y="90" width="100" height="40" rx="4" fill="#fff" stroke="#bdc3c7" stroke-dasharray="2,2"/>
  <text x="110" y="110" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">ID: BAT-9901</text>
  <text x="110" y="122" text-anchor="middle" font-family="Arial" font-size="9" fill="#1b4332">Premium Quality</text>

  <!-- Copy / Clone Action -->
  <path d="M 200 100 Q 280 80 340 120" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="270" y="85" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e74c3c">QR/NFC Cloned</text>

  <!-- Counterfeit Item -->
  <rect x="30" y="180" width="160" height="100" rx="8" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="205" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#78281f">Counterfeit Battery B</text>
  <rect x="60" y="220" width="100" height="40" rx="4" fill="#fff" stroke="#e74c3c"/>
  <text x="110" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">ID: BAT-9901</text>
  <text x="110" y="252" text-anchor="middle" font-family="Arial" font-size="9" fill="#78281f">Substandard / Dangerous</text>

  <!-- Blockchain anchoring -->
  <rect x="420" y="70" width="250" height="160" rx="12" fill="#1b3a4b" stroke="#003554" stroke-width="2" filter="url(#shadow)"/>
  <text x="545" y="95" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Immutable Blockchain Ledger</text>
  
  <rect x="440" y="115" width="210" height="45" rx="4" fill="rgba(46, 196, 182, 0.15)" stroke="#2ec4b6"/>
  <text x="450" y="133" font-family="Arial" font-size="10" fill="#fff">TX 0xab1: BAT-9901 is Genuine</text>
  <text x="450" y="148" font-family="Arial" font-size="9" fill="#2ec4b6">✔ State Verified &amp; Signed</text>

  <rect x="440" y="170" width="210" height="45" rx="4" fill="rgba(46, 196, 182, 0.15)" stroke="#2ec4b6"/>
  <text x="450" y="188" font-family="Arial" font-size="10" fill="#fff">TX 0xcd2: BAT-9901 Owner changed</text>
  <text x="450" y="203" font-family="Arial" font-size="9" fill="#2ec4b6">✔ Blockchain accepts transaction</text>

  <!-- Pointers to the same blockchain record -->
  <line x1="200" y1="115" x2="430" y2="135" stroke="#2ec4b6" stroke-width="1.5"/>
  <line x1="200" y1="230" x2="430" y2="190" stroke="#e74c3c" stroke-width="1.5"/>
  
  <!-- "Broken link" indicator -->
  <circle cx="280" cy="160" r="18" fill="#e74c3c"/>
  <text x="280" y="165" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">!</text>
  <text x="280" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">Link Broken</text>
</svg>
