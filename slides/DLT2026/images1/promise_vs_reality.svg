<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <!-- Defs for shadows and gradients -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Left: The Promise -->
  <rect x="30" y="40" width="290" height="230" rx="12" fill="#e8f8f5" stroke="#2ec4b6" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="75" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#0f5132">The Promise ✨</text>
  <line x1="60" y1="90" x2="290" y2="90" stroke="#2ec4b6" stroke-width="1"/>
  
  <text x="60" y="125" font-family="Arial" font-size="13" font-weight="bold" fill="#1b4332">✔ Trustless Coordination</text>
  <text x="80" y="145" font-family="Arial" font-size="11" fill="#2d6a4f">Decentralized actors collaborate freely</text>
  
  <text x="60" y="175" font-family="Arial" font-size="13" font-weight="bold" fill="#1b4332">✔ Absolute Immutability</text>
  <text x="80" y="195" font-family="Arial" font-size="11" fill="#2d6a4f">No history can ever be falsified later</text>

  <text x="60" y="225" font-family="Arial" font-size="13" font-weight="bold" fill="#1b4332">✔ Seamless Product Transparency</text>
  <text x="80" y="245" font-family="Arial" font-size="11" fill="#2d6a4f">Full consumer insight from raw to recycled</text>

  <!-- Right: The Reality -->
  <rect x="380" y="40" width="290" height="230" rx="12" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="525" y="75" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#c0392b">The Reality ⚠️</text>
  <line x1="410" y1="90" x2="640" y2="90" stroke="#e74c3c" stroke-width="1"/>
  
  <text x="410" y="125" font-family="Arial" font-size="13" font-weight="bold" fill="#78281f">✖ Centralized Consortia</text>
  <text x="430" y="145" font-family="Arial" font-size="11" fill="#922b21">Controlled by few industry oligarchs</text>
  
  <text x="410" y="175" font-family="Arial" font-size="13" font-weight="bold" fill="#78281f">✖ Garbage In, Garbage Out</text>
  <text x="430" y="195" font-family="Arial" font-size="11" fill="#922b21">Immutable storage of forged physical tags</text>

  <text x="410" y="225" font-family="Arial" font-size="13" font-weight="bold" fill="#78281f">✖ IP &amp; Trade Secret Leaks</text>
  <text x="430" y="245" font-family="Arial" font-size="11" fill="#922b21">Exposes logistics, BOM, and supply chain partners</text>
</svg>
