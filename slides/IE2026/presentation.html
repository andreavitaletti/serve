<header>Digital Twin of an Ultrasonic Fermentation System</header>
<h1 id="context-beer-fermentation--ultrasound">Context: Beer Fermentation &amp; Ultrasound</h1>
<ul>
<li>Beer fermentation is a <strong>slow, resource-intensive</strong> industrial process: experiments take days and are costly to repeat</li>
<li><strong>Ultrasound technology</strong> (20–50 kHz, low power) is a promising tool to accelerate yeast activity</li>
</ul>
<div class="highlight">
<p><strong><a href="https://yeastime.com/">Yeastime</a></strong> estimates: a 30% reduction in fermentation time in craft breweries could lead to cost savings of approximately <strong>10–15%</strong></p>
</div>
<ul>
<li>Key effects: improved mass transfer, increased cell permeability, reduced inhibitory metabolites</li>
<li>This work presents the <strong>first digital twin tailored to an ultrasound-treated fermentation system</strong></li>
</ul>
<footer>IE 2026 · 22nd International Conference on Intelligent Environments</footer>
</section>

<header>Digital Twin of an Ultrasonic Fermentation System</header>
<h1 id="what-is-a-digital-twin">What is a Digital Twin?</h1>
<p>A <strong>digital twin</strong> is a virtual representation of a physical system that stays continuously synchronised through real-time data.</p>
<div class="highlight">
<h3 id="i-classfa-solid-fa-lightbulbi-key-benefit"><i class="fa-solid fa-lightbulb"></i> Key Benefit</h3>
<p>Physical fermentation trials are <strong>slow and expensive</strong>, the digital twin complements them with <strong>rapid simulation (growth model) and intelligent actuation</strong>.</p>
</div>
<footer>IE 2026 · 22nd International Conference on Intelligent Environments</footer>

<header>Digital Twin of an Ultrasonic Fermentation System</header>
<h1 id="bayesian-inference-pipeline">Bayesian Inference Pipeline</h1>
<p>Given the <strong>limited dataset</strong>, classical training is ineffective. We adopt [Palacios et al., 2014]:</p>
<ol>
<li><strong>Prior assignment</strong>: probability distributions encode biological domain knowledge</li>
<li><strong>Random Walk Metropolis</strong>: explores the posterior to find valid weight configurations; Metropolis-Hastings criterion escapes local maxima</li>
<li><strong>Network ensemble</strong>: each accepted MCMC state instantiates a distinct NN outputting D, μ, λ</li>
<li><strong>Final prediction</strong>: parameters averaged across all sampled networks → Gompertz curve</li>
</ol>
<div class="highlight">

<header>Digital Twin of an Ultrasonic Fermentation System</header>
<h1 id="actuation-closing-the-loop">Actuation: Closing the Loop</h1>
<p>The digital twin controls the <strong>ultrasonic stimulation parameters</strong>:</p>
<ul>
<li><i class="fa-solid fa-wave-square"></i> <strong>Frequency</strong> — piezoelectric transducer driven at resonance via PWM square wave (ESP32 + H-bridge amplifier)</li>
<li><i class="fa-solid fa-sliders"></i> <strong>Duty cycle</strong> — delivered as energy bursts modulated at 150 Hz</li>
<li><i class="fa-solid fa-thermometer-half"></i> <strong>Temperature</strong> — monitored; closed-loop thermal control is left for future work</li>
</ul>
<div class="highlight">
<p><strong>Accelerating yeast growth</strong> shortens the production cycle → significant economic benefit. The digital twin enables testing actuation strategies <strong>without costly physical trials</strong>.</p>
</div>
<footer>IE 2026 · 22nd International Conference on Intelligent Environments</footer>
