<header>Blockchain Introduction</header>
<h1 id="the-history-of-blockchain-technology">The History of Blockchain Technology</h1>
<table>
<thead>
<tr>
<th>Era</th>
<th>Year</th>
<th>Milestone</th>
</tr>
</thead>
<tbody>
<tr>

<td>1991–2008</td>
<td>Stuart Haber &amp; Scott Stornetta work on first Blockchain; Satoshi Nakamoto releases Bitcoin whitepaper (2008)</td>
</tr>
<tr>
<td><strong>Transactions</strong></td>
<td>2009–2013</td>
<td>First Bitcoin purchase (10,000 BTC); Bitcoin marketplace surpasses $1B</td>
</tr>
<tr>
<td><strong>Contracts</strong></td>
<td>2013–2016</td>
<td>Vitalik Buterin releases Ethereum whitepaper; Ethereum Genesis block created</td>
</tr>
<tr>
<td><strong>Applications</strong></td>
<td>2016–2018</td>
<td>EOS, Hyperledger, R3 consortium; Blockchain for business</td>
</tr>
</tbody>
</table>

<header>Blockchain Introduction</header>
<h1 id="a-transaction-the-exchange-of-an-asset">A Transaction: The Exchange of an Asset</h1>
<div class="two-col">
<div>
<p>A transaction is the <strong>exchange</strong> (or agreement for an exchange) <strong>of an asset</strong></p>
<p>Key elements:</p>
<ul>
<li><strong>FROM</strong> (state A)</li>
<li><strong>TO</strong> (state B)</li>
<li><strong>WHEN</strong></li>
<li><strong>ASSET</strong> (what is transferred)</li>
</ul>
</div>
<div>
<p><strong>Example — Bitcoin Transaction:</strong></p>
<ul>

<header>Blockchain Introduction</header>
<h1 id="trust-individuals--or-servers">Trust &quot;Individuals&quot; … or Servers ;-)</h1>
<div class="box">
<h3 id="%F0%9F%94%92-black-box--centralized-trust"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f512.svg" data-marp-twemoji=""/> Black Box — Centralized Trust</h3>
<p>Traditional financial systems rely on <strong>trusted intermediaries</strong> (banks, gateways) acting as black boxes with &quot;<strong>humans in the loop</strong>&quot;. We trust individuals — or servers — to manage our assets correctly.</p>
</div>
<p>The fundamental question: <strong>What happens when those intermediaries cannot be trusted?</strong></p>
<footer>Sapienza University of Rome</footer>
</section>

;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="consensus-from-society--or-a-distributed-protocol">Consensus from &quot;Society&quot; … or a Distributed Protocol</h1>
<div class="box">
<h3 id="%E2%9C%85-white-box--decentralized-consensus"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> White Box — Decentralized Consensus</h3>
<p>Blockchain replaces centralized trust with <strong>algorithmic consensus</strong> — a distributed protocol run by the &quot;society&quot; of network participants. The rules are open, transparent, and formally verifiable.</p>
</div>
<ul>
<li><strong>Black Box</strong> → Trust individuals / servers</li>
<li><strong>White Box</strong> → Consensus via algorithms</li>
</ul>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="in-the-networking-world">In the Networking World</h1>
<div class="two-col">
<div>
<p><strong>Centralized</strong><br />
One hub controls everything (e.g. Google servers)</p>
<p><strong>Decentralized</strong><br />
Multiple hubs, each with their own spokes</p>
<p><strong>Distributed</strong><br />
Every node is equal; no single point of failure</p>
</div>
<div>
<p>This taxonomy, introduced by <strong>Paul Baran</strong>, applies directly to blockchain architecture.</p>
<p>Blockchain is a <strong>distributed</strong> system — the ledger is replicated across all nodes with no central authority.</p>
</div>
</div>
<div class="source"><a href="https://nvlpubs.nist.gov/nistpubs/ir/2018/NIST.IR.8202.pdf">NIST IR 8202</a></div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="in-governance">In Governance</h1>
<div class="two-col">
<div>
<h3 id="centralized-trust">Centralized: Trust</h3>
<p>One party (individual, institution) is trusted to manage the ledger correctly.</p>
<ul>
<li>Easy to implement</li>
<li>Single point of failure</li>
<li>Opaque processes</li>
</ul>
</div>
<div>
<h3 id="decentralized-consensus">Decentralized: Consensus</h3>
<p>The &quot;society&quot; of participants agrees on the state of the ledger through a protocol.</p>
<ul>
<li>More complex</li>
<li>Resilient and open</li>
<li>Transparent and verifiable</li>
</ul>
</div>
</div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="creation-cryptocurrency-vs-currency">Creation: CryptoCurrency vs Currency</h1>
<div class="two-col">
<div>
<h3 id="cryptocurrency">CryptoCurrency</h3>
<ul>
<li>A <strong>distributed cryptographic protocol</strong></li>
<li>Money is &quot;minted&quot; according to protocol rules</li>
<li>Authenticity via <strong>digital signature</strong></li>
</ul>
</div>
<div>
<h3 id="currency">Currency</h3>
<ul>
<li>Issued by a <strong>Central Bank</strong></li>
<li>Authenticity via:
<ul>
<li>Physical watermarking (bills)</li>
<li>Bank security systems (digital)</li>
</ul>
</li>
</ul>
</div>
</div>

<header>Blockchain Introduction</header>
<h1 id="payments-cryptocurrency-vs-currency">Payments: CryptoCurrency vs Currency</h1>
<div class="two-col">
<div>
<h3 id="cryptocurrency-1">CryptoCurrency</h3>
<ol>
<li>Sender shares their public key (PK_B)</li>
<li>Broadcasts signed transaction</li>
<li>Nodes validate</li>
<li><strong>Consensus protocol</strong> selects block</li>
<li>Transaction is official <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
</ol>
</div>
<div>
<h3 id="currency-1">Currency</h3>
<ol>
<li>Swipe card at merchant</li>
<li>Merchant's bank contacts gateway (e.g. Visa)</li>
<li>Gateway contacts source bank</li>
<li>Banks exchange ledger entries</li>
<li>Settlement occurs <img class="emoji" draggable="false" alt="🏦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3e6.svg" data-marp-twemoji=""/></li>
</ol>
</div>
</div>

<ul>
<li>The <strong>protocol is open</strong></li>
<li>We have <strong>formal proofs</strong></li>
<li><strong>Everyone</strong> can check every transaction on the ledger</li>

</ul>

<h1 id="privacy-digital-currency">Privacy: Digital Currency</h1>
<p>In traditional digital payments, the following parties <strong>see your transactions</strong>:</p>
<ul>
<li>The <strong>source bank</strong></li>
<li>The <strong>destination bank</strong></li>
<li>The <strong>gateways</strong> (e.g. Visa, Mastercard)</li>
</ul>
<p>Payments flow through a chain of trusted intermediaries, each of which maintains a record.</p>
<footer>Sapienza University of Rome</footer>

<header>Blockchain Introduction</header>
<h1 id="privacy-cryptocurrencies">Privacy: Cryptocurrencies</h1>
<p>In a permissionless blockchain like Bitcoin:</p>
<ul>
<li><strong>All</strong> network participants can see all transactions</li>
<li>Transactions are pseudonymous (public keys, not names)</li>
<li>The full transaction graph is publicly visible on the ledger</li>

<p>Linking public keys to real identities (e.g. via KYC at exchanges) can de-anonymize users.</p>

<header>Blockchain Introduction</header>
<h1 id="transaction">Transaction</h1>
<p>A transaction is an <strong>atomic event</strong> supported by the protocol:</p>
<ul>
<li><strong>Andrea → Maria 1 BTC</strong> (simple payment)</li>
<li><strong>State 1 → State 2</strong> in the world computer (smart contract execution)</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>FROM: Andrea    TO: Maria
WHEN: timestamp  WHAT: 1 BTC
↓
Grouped into a Block
↓
Block added to the chain (time →)
</code></pre>
<div class="source"><a href="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/CanadianCheque.svg/1920px-CanadianCheque.svg.png">Wikipedia</a></div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="atomic-transactions">Atomic Transactions</h1>
<div class="box">
<h3 id="%E2%9A%A1-atomicity"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/> Atomicity</h3>
<p>A transaction either <strong>fully succeeds</strong> or <strong>fully fails</strong> — there is no intermediate state. Sending 10 coins from a wallet of 50 must result in exactly 40 remaining — no partial transfers.</p>
</div>
<p>This prevents:</p>
<ul>
<li>Coins being deducted from the sender without being credited to the receiver</li>
<li>Double-spending exploits mid-transfer</li>
<li>Inconsistent ledger states across nodes</li>
</ul>
<footer>Sapienza University of Rome</footer>
</section>

;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="ledger-of-transactions">Ledger of Transactions</h1>
<p>The blockchain is fundamentally a <strong>ledger</strong> — an ordered log of transactions:</p>
<table>
<thead>
<tr>
<th>FROM</th>
<th>TO</th>
<th>WHEN</th>
<th>WHAT</th>
</tr>
</thead>
<tbody>
<tr>
<td>A</td>
<td>B</td>
<td>a/b/c</td>
<td>10</td>
</tr>
<tr>
<td>B</td>
<td>C</td>
<td>e/f/g</td>
<td>5</td>
</tr>
<tr>
<td>B</td>
<td>D</td>
<td>e/f/g</td>
<td>7</td>
</tr>
<tr>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
</tr>
</tbody>
</table>
<p>The key challenge: <strong>where</strong> is this ledger stored, and <strong>who</strong> controls it?</p>
<footer>Sapienza University of Rome</footer>
</section>

;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="ledger-of-transactions-where">Ledger of Transactions: WHERE</h1>
<div class="two-col">
<div>
<p><strong>Centralized (Easy)</strong></p>
<ul>
<li>Intermediaries (banks) manage the ledger</li>
<li>Built on <strong>trust</strong> in individuals</li>
<li>Single point of control</li>
</ul>
</div>
<div>
<p><strong>Distributed (Difficult)</strong></p>
<ul>
<li>No intermediaries — <strong>disintermediation</strong></li>
<li>Requires <strong>consensus</strong> among peers</li>
<li>No single point of failure or control</li>
</ul>
</div>
</div>
<p>The core challenge of blockchain: achieving consensus in a distributed setting without trusted intermediaries.</p>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="where--centralized">WHERE — Centralized</h1>
<p>A <strong>single ledger</strong> sits at the center. All participants connect to it and trust it to be correct.</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Easy to implement</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> High performance</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Single point of failure</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Requires trust in the central party</li>
</ul>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="where--distributed">WHERE — Distributed</h1>
<p><strong>Every node</strong> holds a copy of the ledger. All copies must stay synchronized through a consensus protocol.</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Resilient — no single point of failure</li>

<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Complex consensus required</li>

" lang="en-GB" data-marpit-pagination="23" style="--paginate:true;--header:Blockchain Introduction;--footer:Sapienza University of Rome;--style:@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css')
;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="what-is-blockchain">What is Blockchain?</h1>
<div class="box">
<h3 id="%F0%9F%94%97-definition"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> Definition</h3>
<p>A <strong>distributed ledger</strong> that can record transactions in an <strong>immutable, verifiable, and permanent</strong> way.</p>
</div>
<p><strong>Two key dimensions:</strong></p>
<ol>
<li>
<p><strong>Who writes?</strong> (CONSENSUS)</p>
<ul>
<li><em>Permissioned</em> — only approved participants</li>
<li><em>Permissionless</em> — anyone can propose blocks</li>
</ul>
</li>
<li>
<p><strong>Who reads?</strong></p>
<ul>
<li><em>Private</em> — restricted access</li>
<li><em>Public</em> — open to all</li>
</ul>
</li>
</ol>
<blockquote>
<p><strong>EASY</strong> = making an immutable, verifiable ledger<br />
<strong>DIFFICULT</strong> = achieving decentralized governance (from trust to consensus)</p>
</blockquote>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="trust-vs-consensus">Trust vs Consensus</h1>
<div class="two-col">
<div>
<h3 id="individuals-trust">(Individuals) TRUST</h3>
<p>Traditional systems: banks, gateways, governments manage the ledger.</p>
</div>
<div>
<h3 id="consensus-society">CONSENSUS (Society)</h3>
<p>Blockchain: the network of peers collectively maintains and validates the ledger.</p>
</div>
</div>
<p>This shift from <strong>trust</strong> to <strong>consensus</strong> is the defining innovation of blockchain technology.</p>
<footer>Sapienza University of Rome</footer>

<header>Blockchain Introduction</header>
<h1 id="simple-experiment-network-latency">Simple Experiment: Network Latency</h1>
<p>Try this at home to observe how information travels across the Internet:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Resolve Yahoo Japan&#x27;s IP</span>
nslookup Yahoo.co.jp        <span class="hljs-comment"># → 183.79.135.206</span>

<span class="hljs-comment"># Find where the server is located</span>
curl http://api.geoiplookup.net/?query=183.79.135.206

<span class="hljs-comment"># Measure latency (packet travel time)</span>
ping 183.79.135.206 -c 20

<span class="hljs-comment"># Repeat for a local server</span>
nslookup www.uniroma1.it
ping &lt;ip&gt; -c 20
</code></pre>
<p>What do you observe? Why does this matter for <strong>distributed consensus</strong>?</p>
<footer>Sapienza University of Rome</footer>

<header>Blockchain Introduction</header>
<h1 id="information-asymmetry-and-consensus">Information Asymmetry and Consensus</h1>
<p><strong>Delay, packet loss, and network partitions</strong> lead to:</p>
<div class="box">
<h3 id="%E2%9A%96%EF%B8%8F-information-asymmetry"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2696.svg" data-marp-twemoji=""/> Information Asymmetry</h3>
<p>Different nodes in a distributed network may observe <strong>different states of the world</strong> at any given moment. This makes agreeing on the correct ledger state genuinely hard.</p>
</div>
<p>This is why <strong>consensus</strong> — the process of reaching agreement among distributed, potentially unreliable nodes — is the central technical challenge of blockchain.</p>
<footer>Sapienza University of Rome</footer>
</section>

;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="order-of-events">Order of Events</h1>
<p>In a distributed network, two conflicting transactions might arrive at different nodes in <strong>different orders</strong>:</p>
<ul>
<li>Node A sees: <em>Andrea → Maria</em> first, then <em>Andrea → Bob</em></li>
<li>Node B sees: <em>Andrea → Bob</em> first, then <em>Andrea → Maria</em></li>
</ul>
<p><strong>The double-spend problem</strong>: if Andrea only has enough for one transaction, which one is valid?</p>
<p>The blockchain resolves this by establishing a <strong>canonical order</strong> of events through consensus.</p>
<footer>Sapienza University of Rome</footer>
</section>

;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="ordering-events-with-blocks">Ordering Events with Blocks</h1>
<div class="box">
<h3 id="%E2%9B%93%EF%B8%8F-finality"><img class="emoji" draggable="false" alt="⛓️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26d3.svg" data-marp-twemoji=""/> Finality</h3>
<p>Once a transaction is added to the chain, it is <strong>irreversible</strong> and can no longer be altered or reversed.</p>
</div>
<ul>
<li>Pending transactions wait in a <strong>mempool</strong></li>
<li>Valid transactions are bundled into <strong>blocks</strong></li>
<li>Blocks are chained in order: Block 20 → Block 21 → Block 22 …</li>
<li>Finality can be <strong>deterministic</strong> (e.g. BFT-based) or <strong>probabilistic</strong> (e.g. Bitcoin's Proof of Work)</li>
</ul>
<div class="source"><a href="https://marmelab.com/">Source: marmelab.com</a></div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="ipse-dixit--silvio-micali-algorand">Ipse Dixit — Silvio Micali (Algorand)</h1>
<blockquote>
<p>&quot;If the majority of the money is in honest hands, the system works.&quot;</p>
</blockquote>
<p>When asked how he can guarantee that the majority of users will act benevolently, Micali replied:</p>
<blockquote>
<p>&quot;If a society doesn't have an honest majority, it no longer exists. In our society, do we have criminals? Absolutely — but it's a relatively small percentage. If nobody follows our rules, there is no society.&quot;</p>
</blockquote>
<p>This captures the <strong>social contract</strong> underlying permissionless blockchains.</p>
<footer>Sapienza University of Rome</footer>
</section>

;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="the-problem-of-consensus">The Problem of Consensus</h1>
<div class="box">
<h3 id="%E2%9D%93-core-question"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> Core Question</h3>
<p><strong>How do we select which blocks are recorded in the blockchain, and in what order?</strong></p>
<p>This is the <strong>consensus problem</strong> — the hardest part of building a decentralized system.</p>
</div>
<p>Consensus must be:</p>
<ul>
<li><strong>Safe</strong> — all honest nodes agree on the same chain</li>
<li><strong>Live</strong> — valid transactions eventually get confirmed</li>
<li><strong>Fault-tolerant</strong> — resistant to malicious or faulty nodes</li>
</ul>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="validation-vs-consensus">Validation vs Consensus</h1>
<ul>
<li>
<p><strong>Validation</strong>: A blockchain validator verifies that transactions are <strong>legal</strong> (e.g. you have enough coins). It checks consistency with the protocol — not whether the real-world data is genuine.</p>
</li>
<li>
<p><strong>Consensus</strong>: Determining the <strong>ordering</strong> of events in the blockchain — coming to agreement on that order.</p>
</li>
</ul>
<div class="box">
<h3 id="%F0%9F%9A%A8-key-distinction"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a8.svg" data-marp-twemoji=""/> Key Distinction</h3>
<p>Consensus = agreeing on the <strong>ordering</strong> of validated transactions → <strong>fair selection of blocks</strong> ← this is where attacks are possible.</p>
</div>
<div class="source"><a href="https://businessandleaders.it/2019/02/27/blockchain-validation-vs-consensus/">businessandleaders.it</a></div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="how-does-a-transaction-get-into-the-blockchain">How Does a Transaction Get Into the Blockchain?</h1>
<ol>
<li>Transaction <strong>request raised</strong> by a node</li>
<li>Transaction <strong>broadcast</strong> on the P2P network</li>
<li>Transaction is <strong>validated and verified</strong> by nodes</li>
<li>Verified transaction is <strong>added to a proposed block</strong></li>
<li><strong>Consensus</strong> selects which block is appended to the chain</li>
<li><strong>Transaction complete</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Different nodes might have <strong>different views</strong> of the current chain state — this is why consensus is needed.</p>

<h3 id="human-algorithms">Human Algorithms</h3>

<header>Blockchain Introduction</header>
<h1 id="consensus-a-brief-history">Consensus: A Brief History</h1>
<p>Key milestones in the development of consensus algorithms:</p>
<ul>
<li><strong>1962</strong> — Paul Baran: distributed communications networks</li>
<li><strong>1979</strong> — Byzantine Generals Problem published</li>
<li><strong>1988</strong> — Practical Byzantine Fault Tolerance (PBFT)</li>
<li><strong>1997</strong> — Proof of Work consensus first discussed (Adam Back)</li>
<li><strong>1999</strong> — Proof of Work developed</li>
<li><strong>2008</strong> — Bitcoin (Nakamoto consensus / PoW)</li>
<li><strong>2012</strong> — Proof of Stake developed</li>
<li><strong>2015+</strong> — Ethereum, Algorand, Hyperledger and many more</li>
</ul>
<div class="source"><a href="https://images.squarespace-cdn.com/content/v1/57cafc06893fc06c8c430b02/1477820612716-DK2V3UR1C2BPKJG49Z9L/image-asset.png">Source</a></div>
<footer>Sapienza University of Rome</footer>

<header>Blockchain Introduction</header>
<h1 id="blockchain-trilemma">Blockchain Trilemma</h1>
<blockquote>
<p><strong>Vitalik Buterin</strong> identified a fundamental trade-off in blockchain design:</p>
</blockquote>
<p>Any blockchain can achieve at most <strong>two of three</strong> properties simultaneously:</p>
<ul>
<li><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f512.svg" data-marp-twemoji=""/> <strong>Security</strong> — resistant to attacks</li>
<li><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c8.svg" data-marp-twemoji=""/> <strong>Scalability</strong> — high throughput, low latency</li>
<li><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> <strong>Decentralisation</strong> — no central points of control</li>
</ul>
<p>Most real-world blockchains make deliberate compromises among these three.</p>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="properties-of-distributed-ledger-technology-dlt">Properties of Distributed Ledger Technology (DLT)</h1>
<table>
<thead>
<tr>
<th>Property</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Distributed</strong></td>
<td>All participants have a copy for complete transparency</td>
</tr>
<tr>
<td><strong>Immutable</strong></td>
<td>Validated records are irreversible and cannot be changed</td>
</tr>
<tr>
<td><strong>Time-stamped</strong></td>
<td>A transaction timestamp is recorded on each block</td>
</tr>
<tr>
<td><strong>Unanimous</strong></td>
<td>All network participants agree to the validity of records</td>
</tr>
<tr>
<td><strong>Anonymous</strong></td>
<td>Participant identity is anonymous or pseudonymous</td>
</tr>
<tr>
<td><strong>Secure</strong></td>
<td>All records are individually encrypted</td>
</tr>
<tr>
<td><strong>Programmable</strong></td>
<td>A blockchain is programmable (i.e. Smart Contracts)</td>
</tr>
</tbody>
</table>

<header>Blockchain Introduction</header>
<h1 id="censorship-resistance">Censorship Resistance</h1>
<div class="box">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-a-core-property-of-public-blockchains"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> A Core Property of Public Blockchains</h3>
<p>Because no single party controls a permissionless blockchain, <strong>no one can prevent a valid transaction from being included</strong> in the ledger — provided the sender pays the required fees. This makes blockchain inherently resistant to censorship.</p>
</div>
<p>This property is especially valuable in:</p>
<ul>
<li>Jurisdictions with unstable financial systems</li>
<li>Cross-border payments bypassing capital controls</li>
<li>Applications requiring neutrality (e.g. public voting, supply chain)</li>
</ul>
<div class="source"><a href="https://news.bitcoin.com/deploying-censorship-resistance-to-uphold-decentralization/">news.bitcoin.com</a></div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="db-vs-blockchain-crud-%E2%86%92-crab">DB vs Blockchain: CRUD → CRAB</h1>
<p>Traditional databases use <strong>CRUD</strong>: Create, Read, Update, Delete.</p>
<p>Blockchain uses <strong>CRAB</strong>: Create, Read, Append, <strong>Burn</strong>.</p>
<div class="box">
<h3 id="%F0%9F%94%A5-what-is-burn"><img class="emoji" draggable="false" alt="🔥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f525.svg" data-marp-twemoji=""/> What is &quot;Burn&quot;?</h3>
<p>Deleting from a blockchain conflicts with immutability. Instead, assets are transferred to an <strong>unspendable public key</strong> (e.g. <code>BurnBurnBurn…</code>). The data is never deleted — only the keys controlling it are lost.</p>
</div>
<blockquote>
<p>The <strong>data itself is never deleted</strong> — only the keys to control the transfer of data are lost in a burn operation.</p>
</blockquote>

<header>Blockchain Introduction</header>
<h1 id="privacy-and-blockchain">Privacy and Blockchain</h1>
<div class="box">
<h3 id="%F0%9F%87%AA%F0%9F%87%BA-gdpr-tension"><img class="emoji" draggable="false" alt="🇪🇺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f1ea-1f1fa.svg" data-marp-twemoji=""/> GDPR Tension</h3>
<p>The European Parliament has studied whether distributed ledgers can be reconciled with the <strong>General Data Protection Regulation (GDPR)</strong>. Blockchain's immutability conflicts with the &quot;right to be forgotten&quot; — a core GDPR principle.</p>
</div>
<p>Key conflicts:</p>
<ul>
<li><strong>Right to erasure</strong> vs <strong>immutability</strong></li>
<li><strong>Data minimization</strong> vs <strong>full transaction transparency</strong></li>
<li><strong>Controller accountability</strong> vs <strong>decentralized governance</strong></li>
</ul>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="blockchain-for-sustainable-development-goals">Blockchain for Sustainable Development Goals</h1>
<p>Blockchain has been proposed as a tool for achieving all 17 UN SDGs:</p>
<ul>
<li><strong>No Poverty</strong> — Efficient access to credit, financial traceability</li>
<li><strong>Zero Hunger</strong> — Traceable food production systems</li>
<li><strong>Good Health</strong> — Patients own their secured health data</li>
<li><strong>Quality Education</strong> — Verifiable education records</li>
<li><strong>Reduced Inequality</strong> — Financial inclusion, sharing economy</li>
<li><strong>Climate Action</strong> — Accountability for rapid decarbonization</li>
<li><strong>Sustainable Cities</strong> — Smart IoT management, peer-to-peer markets</li>
</ul>
<blockquote>
<p>A rich narrative — but <strong>in many cases still unmet</strong> in practice.</p>
</blockquote>

<header>Blockchain Introduction</header>
<h1 id="do-we-need-blockchain">Do We Need Blockchain?</h1>
<p>A decision framework by <strong>Wüst &amp; Gervais</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Do you need to store state?
├── No  → Don't use Blockchain
└── Yes → Are there multiple writers?
           ├── No  → Don't use Blockchain
           └── Yes → Can you use an always-online TTP?
                      ├── Yes → Don't use Blockchain
                      └── No  → Are all writers known?
                                 ├── No  → Permissionless Blockchain
                                 └── Yes → Are all writers trusted?
                                            ├── Yes → Is public verifiability required?
                                            │          ├── Yes → Public Permissioned Blockchain
                                            │          └── No  → Private Permissioned Blockchain
                                            └── No  → Public Permissioned Blockchain
</code></pre>
<div class="source"><a href="https://eprint.iacr.org/2017/375.pdf">Wüst & Gervais, 2017</a></div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="ethereum-state-transition-system">Ethereum: State Transition System</h1>
<p>Ethereum can be seen as a <strong>world computer</strong> — a P2P consensus-based state machine:</p>
<ul>
<li><strong>State</strong> — current status of all Ethereum accounts (each with nonce, ETH balance, contract code, storage)</li>
<li><strong>Transaction</strong> — core cryptocurrency functionality + optional data field accessible by smart contracts</li>
<li><strong>State Transition Function</strong> — applies a transaction to the current state, progressing the EVM; capable of processing arbitrary code</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>State  +  Transaction  →  State Transition Function  →  State'
</code></pre>
<div class="source"><a href="https://inevitableeth.com/home/ethereum/evm/state-machine">inevitableeth.com</a></div>
<footer>Sapienza University of Rome</footer>

<div class="two-col">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-solidity">pragma solidity &gt;=0.7.0 &lt;0.9.0;

  function store(uint256 num) public {
    number = num;
  }

  function retrieve() public view
    returns (uint256) {
    return number;
  }
}
</code></pre>

<div>
<p>Computer programs that:</p>
<ul>

<li><strong>Cannot be arbitrarily altered</strong> once deployed</li>

<li><strong>Transfer digital assets</strong> between parties</li>

<header>Blockchain Introduction</header>
<h1 id="the-world-computer-web3">The &quot;World Computer&quot;: Web3</h1>

<h3 id="%F0%9F%8C%90-from-app-to-dapp"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> From App to DApp</h3>

<p>Architecture: Browser → Provider (Alchemy, Infura…) → EVM → Smart Contracts + IPFS</p>

" lang="en-GB" data-marpit-pagination="49" style="--paginate:true;--header:Blockchain Introduction;--footer:Sapienza University of Rome;--style:@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css')
;" data-marpit-pagination-total="54">
<header>Blockchain Introduction</header>
<h1 id="oracles-bridging-on-chain-and-off-chain">Oracles: Bridging On-Chain and Off-Chain</h1>
<div class="box">
<h3 id="%F0%9F%94%AE-the-oracle-problem"><img class="emoji" draggable="false" alt="🔮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f52e.svg" data-marp-twemoji=""/> The Oracle Problem</h3>
<p>Blockchain smart contracts are <strong>deterministic</strong> — they cannot access external data directly, because different nodes might observe different real-world values at different times.</p>
</div>
<p><strong>Oracles</strong> solve this by:</p>
<ol>
<li>Smart contract requests external data</li>
<li>Oracle queries the real-world source (e.g. a sensor, API)</li>
<li>Oracle submits the data as a <strong>blockchain transaction</strong></li>
<li>The data becomes part of the immutable ledger</li>
<li>All nodes process it <strong>deterministically</strong></li>
</ol>
<div class="source"><a href="https://assets-global.website-files.com/5f6b7190899f41fb70882d08/6148588af8ce998ca21d8db8_Blockchain%20Oracle%20Problem.jpg">Chainlink</a></div>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="can-i-prove-that-what-is-on-chain-is-true">Can I Prove That What Is On-Chain Is True?</h1>
<p><strong>Very simply … no, you cannot!</strong></p>
<p>The blockchain guarantees:</p>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> That data has <strong>not been tampered with</strong> after recording</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> That transactions follow the <strong>protocol rules</strong></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> That the <strong>order</strong> of transactions is agreed upon</li>
</ul>
<p>The blockchain does <strong>not</strong> guarantee:</p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> That the <strong>real-world data entered was accurate</strong></li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> That the <strong>off-chain assets</strong> correspond to on-chain tokens</li>
</ul>
<blockquote>
<p>But remember: <strong>when you cheat, it is there forever</strong>. Your reputation — and the evidence — is permanently on-chain.</p>
</blockquote>
<footer>Sapienza University of Rome</footer>
</section>

<header>Blockchain Introduction</header>
<h1 id="personal-opinion--on-asset-creation">Personal Opinion — On Asset Creation</h1>
<div class="box">
<h3 id="%F0%9F%92%AD-andrea-vitaletti"><img class="emoji" draggable="false" alt="💭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ad.svg" data-marp-twemoji=""/> Andrea Vitaletti</h3>
<p><em>&quot;I have no problem in dealing with assets that are <strong>created by trusted entities</strong> (i.e. centralised), provided that their <strong>management is fully decentralised</strong>.&quot;</em></p>
</div>
<p><strong>Self-Sovereign Identity (SSI)</strong> is a good example:</p>
<ul>
<li>Identity credentials are issued by trusted authorities (governments, universities)</li>
<li>But their management and presentation is controlled by the user, without intermediaries</li>
</ul>
<footer>Sapienza University of Rome</footer>

<header>Blockchain Introduction</header>
<h1 id="personal-opinion--on-transparency">Personal Opinion — On Transparency</h1>
<div class="box">
<h3 id="%F0%9F%92%AD-andrea-vitaletti-1"><img class="emoji" draggable="false" alt="💭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ad.svg" data-marp-twemoji=""/> Andrea Vitaletti</h3>
<p><em>&quot;Blockchain (public/permissionless) is undoubtedly superior when <strong>transparency is a requirement</strong>.&quot;</em></p>
</div>
<p>Use cases where transparency is non-negotiable:</p>
<ul>
<li>Public procurement and government spending</li>
<li>Supply chain traceability for consumers</li>
<li>Decentralized voting systems</li>
<li>Open financial protocols (DeFi)</li>
</ul>
